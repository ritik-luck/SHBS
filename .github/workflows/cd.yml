name: CD Pipeline (AWS EC2)

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/shbs
            # Safe pull instead of reset --hard
            git stash
            git pull origin main
            
            # Start up new containers in detached mode and wait for healthchecks
            sudo docker compose up -d --build --remove-orphans
            
            # Smoke test: Wait for backend to be healthy
            echo "Waiting for backend to become healthy..."
            sleep 15
            HEALTH_STATUS=$(curl -s http://localhost:8080/actuator/health | grep -o '"status":"UP"')
            if [ -z "$HEALTH_STATUS" ]; then
              echo "Smoke test failed! Backend is not healthy. Triggering rollback..."
              # Rollback to previous state
              git stash pop
              sudo docker compose up -d --build --remove-orphans
              exit 1
            fi
            echo "Smoke test passed. Deployment successful."
