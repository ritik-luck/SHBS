spring.application.name=backend
spring.profiles.active=local
server.port=${PORT:8080}
cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000}
alert.email.recipient=${ALERT_EMAIL_RECIPIENT:ritiklucky48@gmail.com}

admin.username=${ADMIN_USERNAME}
admin.password=${ADMIN_PASSWORD}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/shbs}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USERNAME:}
spring.data.redis.password=${REDIS_PASSWORD:}

resilience4j.ratelimiter.instances.apiLimiter.limitForPeriod=5
resilience4j.ratelimiter.instances.apiLimiter.limitRefreshPeriod=10s
resilience4j.ratelimiter.instances.apiLimiter.timeoutDuration=0

# Bulkhead: limit concurrent calls to downstream inventory service
resilience4j.bulkhead.instances.inventoryBulkhead.maxConcurrentCalls=10
resilience4j.bulkhead.instances.inventoryBulkhead.maxWaitDuration=500ms

# Connection pool limits
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.idle-timeout=300000

spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db,redis

# Metrics Configuration & Labels
management.metrics.tags.application=shbs
management.metrics.tags.environment=${SPRING_PROFILES_ACTIVE:local}
management.metrics.tags.version=1.0.0
management.metrics.tags.instance=${HOSTNAME:backend}
management.metrics.export.prometheus.enabled=true

# Histograms
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles-histogram.inventory_check_duration=true

# Tracing (OpenTelemetry)
management.tracing.enabled=true
management.tracing.sampling.probability=1.0
management.otlp.tracing.endpoint=http://otel-collector:4318/v1/traces

# Graceful shutdown
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Data retention
shbs.retention.days=30
shbs.retention.audit.days=365
shbs.retention.metrics.days=30

# Groq AI (RAG Postmortem)
groq.api.key=${GROQ_API_KEY:}

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Inventory downstream service
inventory.service.url=${INVENTORY_SERVICE_URL:http://localhost:8081}

# Async (for AI postmortem)
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=5
