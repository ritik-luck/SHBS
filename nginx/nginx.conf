# ══════════════════════════════════════════════════════════════════════
# SHBS — Nginx Reverse Proxy Configuration
# ══════════════════════════════════════════════════════════════════════

# ── Rate Limiting Zones ──
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

# ── JSON Log Format ──
log_format json_combined escape=json
  '{'
    '"time_local":"$time_iso8601",'
    '"remote_addr":"$remote_addr",'
    '"request":"$request",'
    '"status":$status,'
    '"body_bytes_sent":$body_bytes_sent,'
    '"request_time":$request_time,'
    '"upstream_response_time":"$upstream_response_time",'
    '"http_referer":"$http_referer",'
    '"http_user_agent":"$http_user_agent",'
    '"request_id":"$request_id"'
  '}';

# ── Upstream ──
upstream shbs_backend {
    server backend:8080 max_fails=3 fail_timeout=15s;
}

# ── HTTP → HTTPS Redirect (production) ──
# Uncomment when TLS certs are in place:
# server {
#     listen 80;
#     server_name _;
#     return 301 https://$host$request_uri;
# }

# ── Main Server Block ──
server {
    listen 80;
    # For HTTPS (uncomment when certs are ready):
    # listen 443 ssl http2;
    # ssl_certificate     /etc/nginx/ssl/cert.pem;
    # ssl_certificate_key /etc/nginx/ssl/key.pem;
    # ssl_protocols       TLSv1.2 TLSv1.3;
    # ssl_ciphers         HIGH:!aNULL:!MD5;
    # ssl_prefer_server_ciphers on;

    server_name _;

    # ── Security Limits ──
    client_max_body_size 10m;

    # ── Proxy Timeouts ──
    proxy_connect_timeout 5s;
    proxy_read_timeout 10s;
    proxy_send_timeout 5s;

    # ── Standard Proxy Headers ──
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Request-ID $request_id;

    # ── Logging ──
    access_log /var/log/nginx/access.log json_combined;
    error_log  /var/log/nginx/error.log warn;

    # ── Frontend (React) ──
    location / {
        proxy_pass http://frontend:80;
    }

    # ── Public Health Check (for ALB / smoke tests) ──
    location /health {
        proxy_pass http://shbs_backend;
        limit_req zone=api_limit burst=10 nodelay;
    }

    location /hello {
        proxy_pass http://shbs_backend;
    }

    # ── API Proxy (rate-limited) ──
    location /api/ {
        proxy_pass http://shbs_backend;
        limit_req zone=api_limit burst=20 nodelay;

        # Only retry idempotent methods on upstream failure
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
    }

    # ── Admin (auth required, rate-limited login) ──
    location /admin/login {
        proxy_pass http://shbs_backend;
        proxy_set_header Authorization $http_authorization;
        limit_req zone=login_limit burst=3 nodelay;
    }

    location /admin/ {
        proxy_pass http://shbs_backend;
        proxy_set_header Authorization $http_authorization;
        limit_req zone=api_limit burst=10 nodelay;
    }

    # ── WebSocket Proxy (with keepalive) ──
    location /ws {
        proxy_pass http://shbs_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── Restricted: Internal / Admin-Only Endpoints ──
    # These should only be accessible from internal networks or via VPN.
    # In production, use `allow` directives or move behind ALB internal listeners.

    location /actuator/ {
        # Block public access in production
        # allow 10.0.0.0/8;
        # deny all;
        proxy_pass http://shbs_backend;
        limit_req zone=api_limit burst=5 nodelay;
    }

    location /metrics/ {
        # allow 10.0.0.0/8;
        # deny all;
        proxy_pass http://shbs_backend;
    }

    location /system/ {
        # allow 10.0.0.0/8;
        # deny all;
        proxy_pass http://shbs_backend;
    }

    location /simulate-failure {
        # allow 10.0.0.0/8;
        # deny all;
        proxy_pass http://shbs_backend;
    }
}
